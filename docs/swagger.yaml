      name:
        type: string
      slug:
        type: string
    type: object
  github_com_arttVinci_fixora-Backend_internal_modules_report_src_model.CreateReportRequest:
    properties:
      address:
        maxLength: 500
        type: string
      category_id:
        type: string
      description:
        type: string
      latitude:
        maximum: 90
        minimum: -90
        type: number
      longitude:
        maximum: 180
        minimum: -180
        type: number
      reporter_email:
        maxLength: 150
        type: string
      severity:
        enum:
        - ringan
        - sedang
        - parah
        type: string
      staging_session_id:
        type: string
      title:
        maxLength: 200
        type: string
    required:
    - category_id
    - latitude
    - longitude
    - severity
    - staging_session_id
    - title
