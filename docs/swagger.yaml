      id:
        type: string
      last_confirmed_at:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      merged_into_id:
        type: string
      photo_url:
        type: string
      related_reports:
        items:
          $ref: '#/definitions/github_com_arttVinci_fixora-Backend_internal_modules_report_src_model.ReportMapResponse'
        type: array
      severity:
        type: string
      source:
        type: string
      source_url:
        type: string
      status:
        type: string
      title:
        type: string
      total_confirmations:
